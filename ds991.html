<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DS991 Calculator Simulator</title>
<style>
  /* ---------------------------------------------------------------------------
     Stylesheet map
       1. theme variables + page shell
       2. brand / solar strip
       3. LCD: bezel, status bar, menu, expression, cursor, maths templates
       4. small data tables (STAT / MATRIX / TABLE)
       5. physical keys
       6. d-pad cluster
       7. responsive tweaks
     The LCD ink colour and the SHIFT/ALPHA label colours are variables so the
     simulated screen and the printed labels stay in step.
     --------------------------------------------------------------------------- */
  :root{
    --shift:#d8b24a;
    --alpha:#e0559a;
    --blue:#2f6fd0;
    --lcd-ink:#20261a;
    --body1:#3b3f45;
    --body2:#191b1f;
    --key1:#fbfbf8;
    --key2:#dedfda;
    --keyedge:#a9aaa4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(circle at 50% 0%,#3a3f47,#14161a 70%);
    min-height:100vh;
    display:flex;
    align-items:center;
    align-items:safe center;
    justify-content:center;
    padding:18px 8px 40px;
    user-select:none;
    -webkit-user-select:none;
    overflow-x:hidden;
  }
  .calculator{
    width:min(420px, 96vw);
    zoom:0.95;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.018) 0 2px, transparent 2px 4px),
      linear-gradient(155deg,#4a4f56 0%,#25282d 22%,#191b1f 62%,#2b2e33 100%);
    border:1px solid #0b0c0e;
    border-radius:30px 30px 34px 34px;
    padding:14px 16px 22px;
    box-shadow:0 32px 60px rgba(0,0,0,.65), 0 2px 0 rgba(255,255,255,.06) inset, 0 -3px 0 rgba(0,0,0,.5) inset;
    position:relative;
  }
  /* ---- brand strip and the decorative solar cell ---- */
  .brandrow{display:flex; justify-content:space-between; align-items:flex-start; padding:2px 6px 4px;}
  .brand{line-height:1;}
  .brand .manuf{color:#ececec; font-weight:900; letter-spacing:2.5px; font-size:21px; text-shadow:0 1px 0 #000;}
  .brand .model{color:#c6c8cb; font-size:9px; letter-spacing:.5px; margin-top:3px;}
  .brand .classwiz{color:#e23b3b; font-size:12px; letter-spacing:5px; margin-top:4px; font-weight:600;}
  .solar{
    width:96px;height:30px;margin-top:4px;border:1px solid #07080a;border-radius:4px;
    background:#0d0f12;display:flex;gap:2px;padding:3px;box-shadow:inset 0 0 8px #000;
  }
  .solar i{flex:1;background:linear-gradient(#262c33,#0c0e11);border-radius:1px;}
  /* ---- LCD: recessed bezel, screen glass, status bar ---- */
  .lcd-behind{background:#08090a;border-radius:10px;padding:9px;margin:8px 4px 16px;box-shadow:inset 0 3px 8px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.05);}
  .lcd{
    position:relative;
    height:158px;
    border-radius:4px;
    background:
      repeating-linear-gradient(0deg, rgba(60,75,45,.10) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(60,75,45,.08) 0 1px, transparent 1px 3px),
      linear-gradient(160deg,#d3dcc0,#bcc7a4 60%,#aeb996);
    box-shadow:inset 0 0 0 1px #83906f, inset 0 0 22px rgba(50,62,38,.35);
    color:var(--lcd-ink);
    font-family:"Courier New",ui-monospace,monospace;
    font-weight:700;
    padding:5px 9px 6px;
    overflow:hidden;
  }
  .status{display:flex; gap:9px; font-size:9px; line-height:1; height:15px; align-items:center; letter-spacing:.5px;}
  .status .left{display:flex;gap:4px;align-items:center;}
  .status .angle-icons{display:flex;gap:3px;align-items:center;margin-left:12px;}
  .ind{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:14px;height:14px;padding:0 2px;border-radius:2px;
    font-size:9px;font-weight:900;line-height:1;
    border:1px solid rgba(27,32,22,.45);
    color:rgba(27,32,22,.45);background:rgba(27,32,22,.05);
    transition:background .12s,color .12s,box-shadow .12s;
  }
  .ind.on{background:#1b2016;color:#fff;border-color:#1b2016;box-shadow:0 0 0 1px rgba(255,255,255,.18) inset;}
  #st-m{visibility:hidden;}
  #st-m.on{visibility:visible;}
  .status .right{display:flex;gap:9px;margin-left:auto;align-items:center;}
  .mod-banner{
    display:inline-flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:900;letter-spacing:1px;
    padding:1px 4px;border-radius:2px;
    color:#fff;background:#1b2016;visibility:hidden;
  }
  .mod-banner.on{visibility:visible;}
  .screen-main{position:absolute; left:9px; right:9px; top:20px; bottom:6px; display:flex; flex-direction:column;}
  /* ---- menu pages drawn on the LCD (MODE list, SETUP, OPTN, ...) ---- */
  .menu-title{font-size:14px; text-align:center; letter-spacing:1px; margin-bottom:2px;}
  .menu-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:6px 4px; align-content:start; padding-top:2px;}
  .menu-item{text-align:center; font-size:8px; line-height:1.15; border-radius:4px; padding:3px 1px; cursor:pointer;}
  .menu-item .ico{
    display:flex;align-items:center;justify-content:center;
    height:26px;margin:0 auto 2px;border:1.5px solid var(--lcd-ink);border-radius:4px;width:30px;
    font-size:13px;font-family:inherit;
  }
  .menu-item.sel{background:rgba(32,38,26,.16);}
  .menu-item.sel .ico{background:var(--lcd-ink);color:#c7d1b3;}
  /* ---- the calculation screen: expression line + answer line ---- */
  .exprwrap{
    flex:1; display:flex; flex-direction:column; justify-content:center;
    min-height:0;
  }
  .exprline{
    display:flex; align-items:center; flex-wrap:wrap; justify-content:flex-start;
    font-size:19px; min-height:44px; line-height:1.15;
    direction:ltr;
    /* NOT overflow:hidden: an exponent is raised with a relative offset, which
       does not grow the line box, so clipping here cut the upper levels of a
       tower of powers off the screen. Vertical position is handled by
       ensureCursorVisible() instead. */
    overflow:visible;
  }
  .exprline.scroll{overflow-x:auto; overflow-y:hidden; scrollbar-width:none;}
  .exprline::-webkit-scrollbar{display:none;}
  .resultline{font-size:19px; text-align:right; min-height:30px; display:flex; justify-content:flex-end; align-items:center; gap:6px; padding-right:2px;}
  .resultline .sub{font-size:9px; margin-left:4px; vertical-align:sub;}
  .screen-scroll{flex:1; overflow:auto; scrollbar-width:thin;}
  .prompt{font-size:13px; padding:2px 0;}
  /* ---- caret and the Natural-Display maths templates ---- */
  .cursor{display:inline-block;width:2px;height:1.05em;background:var(--lcd-ink);margin:0 1px;vertical-align:middle;animation:blink 1.05s steps(1) infinite;}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .math{display:inline-flex;align-items:center;flex-wrap:nowrap;}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;font-size:.82em;line-height:1.05;}
  .frac>.num{border-bottom:2px solid currentColor;padding:0 3px;}
  .frac>.den{padding:0 3px;}
  .mixed{display:inline-flex;align-items:center;}
  .frac>.num:empty,.frac>.den:empty{min-height:.8em;}
  .sqrt{display:inline-flex;align-items:stretch;margin:0 1px;}
  .sqrt>.rad{font-size:1.25em;line-height:1;transform:translateY(-1px);}
  .sqrt>.body{border-top:2px solid currentColor;padding:1px 3px 0 3px;display:inline-flex;align-items:center;}
  /* An exponent is raised with a relative offset rather than vertical-align:
     the surrounding .math boxes are inline-FLEX, so a child with
     vertical-align is a flex item and the property is simply ignored (which is
     why the exponent used to sit in the middle on the right).
     The size is an absolute .7em and nested exponents reset it, so "2^3",
     "2^3^4", "2^3^4^5"... all print at the SAME size and only step up-right. */
  /* Every exponent uses the SAME size whatever its nesting depth; only the
     position moves up and to the right. A depth-scaled font made deep towers
     unreadable, and a relative font-size compounded ("2^3^4^5" shrinking at
     every level) - see the spec, section 7. */
  /* The size and the lift of an exponent are no longer constants here: the
     renderer emits them per level (renderExponent), so a nested exponent keeps
     the same size while its offset grows. */
  .sup{font-size:.70em;vertical-align:baseline;line-height:1;position:relative;}
  .sub{font-size:.62em;line-height:1;}
  .logbase{display:inline;white-space:nowrap;}
  .logbase .sub{vertical-align:-0.34em;}
  .logbase .lbp{display:inline;}
  /* log base placeholder: a tall narrow rectangle; the base one is solid */
  .logbase .lbp>.box{min-width:.54em;height:1.5em;margin:0 2px;}
  .logbase .sub>.box{border-color:var(--lcd-ink);background:var(--lcd-ink);}
  .box{display:inline-block;min-width:.62em;height:.72em;border:1.4px solid rgba(32,38,26,.6);border-radius:2px;vertical-align:middle;margin:0 1px;}
  .bigop{display:inline-flex;align-items:center;margin:0 1px;}
  /* the integral keeps its limits against the top and bottom of the sign, but
     must not grow the line box: the tall limits are allowed to overflow their
     container symmetrically instead of stretching it */
  .bigop:has(>.lim.tall){line-height:1;}
  .bigop>.sym{font-size:1.55em;line-height:1;}
  .bigop>.lim{display:inline-flex;flex-direction:column;font-size:.5em;line-height:1.05;margin-left:1px;}
  /* the integral's limits hug the very top and bottom of the sign */
  /* Integral bounds. They print after the sign as a small stack with the upper
     limit on top and the lower limit underneath: .lim is a flex column, so the
     children stack in document order (see the intg renderer) and alignment
     properties would be ignored. The stack overflows its container
     symmetrically rather than stretching the line box, which is what used to
     push the integral off the LCD. */
  .bigop>.lim.tall{align-self:center;justify-content:space-between;font-size:.5em;margin:0 1px;line-height:1;overflow:visible;}
  /* integral: sign, bounds, integrand in three grid columns. The integrand is
     printed last but is the first slot the caret walks */
  /* Integral. Document order is the navigation order (integrand first), but the
     limits are taken out of the flow so the printed result still reads
     "sign, bounds, integrand".

     The limits span the whole height of the sign, so the upper one hugs its top
     and the lower one its bottom, and they are allowed to overflow the (short)
     line box symmetrically rather than stretching it - stretching is what used
     to push the integral off the LCD. */
  .bigop.intgb{position:relative;align-items:center;padding-left:1.9em;min-height:2.6em;}
  .bigop.intgb>.sym{position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:1.85em;}
  .bigop.intgb>.lim.tall{position:absolute;left:1.6em;top:50%;transform:translateY(-50%);
    height:2.5em;font-size:.7em;overflow:visible;}
  .bigop.intgb>.lim.tall>span{line-height:1;}
  .dydx{display:inline-flex;flex-direction:column;align-items:center;font-size:.62em;line-height:1;margin-right:2px;}
  .dydx .bar{border-top:1.5px solid currentColor;width:100%;}
  .paren{color:inherit;}
  .muted{opacity:.55;}
  /* ---- keyboard pads: two CSS grids that the key data is placed into ---- */
  .pad-top{display:grid;grid-template-columns:repeat(30,1fr);gap:0 4px;align-items:center;margin:2px 0 12px;}
  .pad-main{display:grid;grid-template-columns:repeat(30,1fr);gap:28px 4px;align-items:end;}
  .pad-main .keycell.fnrow .key{height:26px;width:86%;font-size:13px;}
  /* ---- a single key: the flat keycap, its pressed state, and the printed
     SHIFT (yellow) / ALPHA (pink) labels shown above it ---- */
  .keycell{position:relative;display:flex;align-items:center;justify-content:center;}
  .key{
    position:relative;z-index:2;width:100%;height:37px;
    border:none;border-radius:9px;cursor:pointer;
    background:linear-gradient(#ffffff,#e2e3de 70%,#d2d3cd);
    color:#16181c;font-family:inherit;font-weight:600;font-size:15px;
    box-shadow:0 2.5px 0 var(--keyedge),0 4px 5px rgba(0,0,0,.55);
    transition:transform .04s ease, box-shadow .04s ease;
    display:flex;align-items:center;justify-content:center;line-height:1;
    padding:0;overflow:visible;
  }
  .key:active,.key.pressed{transform:translateY(2.5px);box-shadow:0 0 0 var(--keyedge),0 1px 2px rgba(0,0,0,.5);}
  .key.del,.key.ac{background:linear-gradient(#4f8ee6,#2f6fd0 70%,#265fb5);color:#fff;box-shadow:0 2.5px 0 #1d4c93,0 4px 5px rgba(0,0,0,.55);}
  .key.del:active,.key.ac:active,.key.del.pressed,.key.ac.pressed{box-shadow:0 0 0 #1d4c93,0 1px 2px rgba(0,0,0,.5);}
  /* the four top control keys are drawn flat; their printed name sits above the
     plate just like the SHIFT/ALPHA labels of the other keys, and the plate
     itself carries no label and no highlight */
  .key.roundk{
    width:40px;height:40px;border-radius:50%;font-size:9px;color:#f2f2f2;
    background:radial-gradient(circle at 34% 26%,#fdfdfd,#dfe1e4 30%,#aeb2b8 62%,#71767d 100%);
    box-shadow:0 2px 4px rgba(0,0,0,.6),inset 0 1px 1px rgba(255,255,255,.85),inset 0 -2px 3px rgba(0,0,0,.28);
    margin:18px auto 0;font-weight:700;letter-spacing:.5px;
  }
  /* the printed name of a top key reads like a primary label (white); the
     yellow SHIFT-style colour is reserved for the SETTINGS label and for the
     SHIFT/ALPHA keys themselves */
  .key.roundk .sl{top:-15px;font-size:9px;color:#e8eaec;}
  /* NB .key.roundk .sl (0,3,0) outranks .key .sl (0,2,0), so the SETTINGS
     label — which carries the .right marker — needs its own rule here or it
     silently inherits the white primary-name colour. */
  .key.roundk .sl.right{color:var(--shift);text-shadow:0 1px 0 rgba(0,0,0,.35);}
  .key.roundk.shiftk .sl{color:#f2d878;}
  .key.roundk.alphak .sl{color:#ff9bc7;}
  .key.roundk:active,.key.roundk.pressed{transform:translateY(1.5px);box-shadow:0 0 0 #101114,0 1px 2px rgba(0,0,0,.5);}
  .pad-top .keycell{overflow:visible;}
  .key .sl{position:absolute;top:-13px;font-size:8.5px;font-weight:700;color:var(--shift);white-space:nowrap;line-height:1;text-shadow:0 1px 0 rgba(0,0,0,.35);}
  .key .al{position:absolute;top:-13px;font-size:8.5px;font-weight:700;color:var(--alpha);white-space:nowrap;line-height:1;text-shadow:0 1px 0 rgba(0,0,0,.35);}
  .key .sl.center,.key .al.center{left:50%;transform:translateX(-50%);}
  .key[data-key="INTG"] .sl{top:-21px;}
  .key[data-key="SD"] .sl{top:-19px;}
  .key .sl.left{left:3px;}
  .key .sl.right{right:3px;}
  /* the two names on the MENU key need a little air between them */
  .key.roundk .sl.right{right:0;}
  .key.roundk .sl.left{left:0;}
  .key .al.right{right:3px;}
  .calculator.shift-on .key .sl{color:#ffe38f;text-shadow:0 0 7px rgba(216,178,74,.95),0 0 2px #000;font-weight:900;}
  .calculator.shift-on .key.roundk.shiftk .sl{color:#ffe38f;text-shadow:0 0 9px rgba(216,178,74,.95);}
  .calculator.alpha-on .key .al{color:#ff9ecb;text-shadow:0 0 7px rgba(224,85,154,.95),0 0 2px #000;font-weight:900;}
  .calculator.alpha-on .key.roundk.alphak .sl{color:#ff9ecb;text-shadow:0 0 9px rgba(224,85,154,.9);}
  .calculator.shift-on .key:not(.roundk) .prim,.calculator.alpha-on .key:not(.roundk) .prim{opacity:.55;}
  .key .prim{display:inline-flex;align-items:center;justify-content:center;pointer-events:none;}
  .kcap-sub{font-size:.62em;position:relative;top:.3em;margin-left:1px;}
  .kbox{display:inline-block;width:.72em;height:.72em;border:1.4px solid currentColor;border-radius:1.5px;vertical-align:middle;box-sizing:border-box;}
  .kbox.sm{width:.5em;height:.5em;}
  .kbox.wide{width:1.15em;height:.6em;}
  .kbox.solid{background:currentColor;}
  .kbox.integrand{width:.72em;height:.44em;background:currentColor;border-radius:1px;margin-left:.34em;}
  .kfrac{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;vertical-align:middle;}
  .kfrac .kf-n,.kfrac .kf-d{display:block;width:8px;height:4px;border:1.3px solid currentColor;border-radius:1px;box-sizing:border-box;}
  .kfrac .kf-n.solid{background:currentColor;}
  .kfrac .kf-bar{display:block;width:11px;height:1.5px;background:currentColor;margin:1px 0;}
  .kfrac.sm .kf-n,.kfrac.sm .kf-d{width:6px;height:3px;border-width:1.1px;}
  .kfrac.sm .kf-bar{width:8.5px;height:1.2px;}
  .kfrac-txt{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-size:.9em;line-height:1;vertical-align:middle;}
  .kfrac-txt .n,.kfrac-txt .d{display:block;padding:0 1px;}
  .kfrac-txt .bar{display:block;width:100%;height:1.3px;background:currentColor;margin:1px 0;}
  .kfrac-switch{display:inline-flex;align-items:center;gap:2px;vertical-align:middle;}
  .kcap-sup{display:inline-block;font-size:.62em;position:relative;top:-.42em;margin-left:.5px;}
  .kmix{display:inline-flex;align-items:center;gap:2px;justify-content:center;}
  .intgblk{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1.5px;justify-content:center;margin-left:0;}
  .intgblk .bound-u{margin-left:-.06em;}
  .intgblk .bound-l{margin-left:-.24em;}
  .key .prim.big{font-size:19px;font-weight:700;}
  .key .prim.it{font-style:italic;font-family:Georgia,"Times New Roman",serif;font-size:18px;}
  .key .prim.sm{font-size:12px;}
  .key .stack{display:inline-flex;flex-direction:column;align-items:center;font-size:11px;line-height:1.0;vertical-align:middle;}
  .key .stack .n{border-bottom:1.6px solid currentColor;padding:0 3px;}
  /* ---- the navigation cluster: a clip-path ring plus four hit areas ---- */
  .dpad{position:relative;width:122px;height:76px;margin:30px auto 0;}
  .dpd-ring,.dpd-face{
    position:absolute;inset:0;
    clip-path:path("M 12.7 30.1 Q 0 38 12.7 45.9 L 48.3 68.1 Q 61 76 73.7 68.1 L 109.3 45.9 Q 122 38 109.3 30.1 L 73.7 7.9 Q 61 0 48.3 7.9 Z");
  }
  .dpd-ring{background:#0e0f11;transform:scale(1.05);}
  .dpd-face{
    overflow:hidden;
    background:
      radial-gradient(ellipse 62% 58% at 50% 36%, #f0ebdf 0%, #dbd5c7 38%, #b6b0a2 68%, #8b867a 100%);
  }
  .dpbar{
    position:absolute;left:50%;top:50%;width:190%;height:11px;z-index:3;
    background:#111214;pointer-events:none;
  }
  .dpbar.b1{transform:translate(-50%,-50%) rotate(32deg);}
  .dpbar.b2{transform:translate(-50%,-50%) rotate(-32deg);}
  .dp{position:absolute;left:0;top:0;width:100%;height:100%;border:none;padding:0;margin:0;background:transparent;cursor:pointer;z-index:2;}
  .dp.up{clip-path:polygon(50% 50%,0 0,100% 0);}
  .dp.down{clip-path:polygon(50% 50%,100% 100%,0 100%);}
  .dp.left{clip-path:polygon(50% 50%,0 100%,0 0);}
  .dp.right{clip-path:polygon(50% 50%,100% 0,100% 100%);}
  .dp.up:active,.dp.up.pressed,.dp.down:active,.dp.down.pressed,.dp.left:active,.dp.left.pressed,.dp.right:active,.dp.right.pressed{background:rgba(255,255,255,.3);}
  .dpd-hub{
    position:absolute;left:50%;top:50%;width:30px;height:30px;z-index:4;
    transform:translate(-50%,-50%) scaleX(1.32) rotate(45deg);
    background:radial-gradient(ellipse at 42% 32%,#3d3f43,#121316 74%);
    border-radius:6px;
    box-shadow:inset 0 1px 1px rgba(255,255,255,.2), 0 1px 2px rgba(0,0,0,.6);
  }
  .dp.ok{left:50%;top:50%;width:36px;height:26px;transform:translate(-50%,-50%);border-radius:6px;z-index:5;background:transparent;}
  .dp.ok:active,.dp.ok.pressed{background:rgba(0,0,0,.32);}
  .hint{color:#8b8f96;font-size:10px;text-align:center;margin-top:14px;letter-spacing:.4px;}
  .power-off .lcd{background:linear-gradient(160deg,#c9d3b5,#aeb996);}
  .power-off .screen-main{display:none;}
  .power-off .status{opacity:0;}
  .badge{position:absolute;bottom:7px;right:14px;font-size:9px;color:#5a5e64;letter-spacing:1px;}
  /* ---- small data tables used by the STAT / MATRIX / TABLE screens ---- */
  table.cells{border-collapse:collapse;font-size:12px;font-family:inherit;}
  table.cells td{border:1px solid rgba(32,38,26,.45);padding:1px 6px;min-width:34px;text-align:right;height:19px;}
  table.cells td.head{border:none;font-weight:900;text-align:center;background:transparent;}
  table.cells td.sel{background:rgba(32,38,26,.18);}
  table.cells td.curnum{box-shadow:inset 0 0 0 2px var(--lcd-ink);}
  .panel-title{font-size:11px;font-weight:900;margin:0 0 3px;letter-spacing:.5px;}
  .kv{font-size:11px;line-height:1.5;}
  .kv b{display:inline-block;min-width:52px;}
  .stat-res{font-size:10.5px;line-height:1.45;}
  .stat-res span{display:inline-block;min-width:70px;}
  .tbl{font-size:11px;font-family:inherit;border-collapse:collapse;}
  .tbl td,.tbl th{border:1px solid rgba(32,38,26,.4);padding:0 6px;text-align:right;height:17px;}
  .tbl th{background:rgba(32,38,26,.12);}
  /* ---- responsive: shrink key metrics on narrow phones, keeping order ---- */
  @media (max-width:430px){
    .calculator{padding:12px 11px 18px;}
    .key{height:34px;font-size:14px;}
    .key .sl,.key .al{font-size:7.5px;}
    .lcd{height:150px;}
    .exprline,.resultline{font-size:17px;}
  }

<script>
/*
 * ============================================================================
 * DS991 - a browser simulator for the fx-991CN X.
 * ============================================================================
 *
 * The whole application is this single IIFE. The pipeline is:
 *
 *     key (mouse / touch / keyboard)
 *         -> dispatch(id)                 route a physical key to a command
 *         -> input* / do* / handle*       mutate the expression or the state
 *         -> render()                     redraw the LCD from that state
 *
 * ---------------------------------------------------------------------------
 * The expression model
 * ---------------------------------------------------------------------------
 * `root` is an ARRAY OF TOKENS (not one node) so a top level expression is just
 * the same thing as the contents of a template slot. Every node is a plain
 * object with a `t` (type) tag, see the T_* factories below. Composite nodes
 * (fractions, roots, integrals...) hold their children in NAMED ARRAYS, e.g.
 *
 *     {t:"frac", num:[...], den:[...]}
 *
 * ---------------------------------------------------------------------------
 * The cursor model  (the single most important idea in this file)
 * ---------------------------------------------------------------------------
 * `stack` is the cursor path. Frame 0 is always `root`; deeper frames are the
 * slots of the templates the caret has descended into:
 *
 *     stack = [ {arr:root,pos:0}, {arr:fracNode.num,pos:2,node:fracNode,slot:"num"} ]
 *
 * The `pos` of a frame is a *digit offset into that frame's array*, NOT a token
 * index. A token such as the number "12" spans two caret positions, so:
 *
 *   - LEFT/RIGHT move exactly one digit and can sit in the middle of a number
 *   - UP/DOWN keep the same digit offset when hopping between a template's
 *     slots, which is what makes the numerator/denominator line up
 *   - insertion is a plain splice, so a node typed inside a number first split
 *     that number ("12" + "^" at offset 1 -> "1", "^", "2")
 *
 * `digitsIn()` / `arrDigits()` measure an array in digit offsets, and the
 * conversion helpers (tokenAt / tokenAtPos / insertIndex / leftToken /
 * tokenEnd / offsetInToken) translate between offsets and token indices. When a
 * count is needed for OUTER layout purposes use `slotDigits()` instead, which
 * forces empty slots to still occupy one digit so they stay reachable.
 *
 * ---------------------------------------------------------------------------
 * Rendering
 * ---------------------------------------------------------------------------
 * `render()` picks a screen function from the current mode. The calculation
 * screen is drawn by rendering the expression tree straight to HTML; templates
 * render each slot with `slotOrBox()`, which draws the caret when the caret is
 * inside that slot and a placeholder box when the slot is empty.
 *
 * The file is ordered bottom-up so that helpers are already defined by the time
 * the behavioural sections use them.

(function(){

  mode:"CALC",         /* one of MODES */
  base:10,             /* Base-N mode: 2, 8, 10 or 16 */
  shift:false,         /* SHIFT is armed and will apply to the next key */

   from inside it leave the power instead of stopping inside the box. */
function emptyExpRect(){
  var f=cur();
  if(!f || !f.node || f.node.t!=="pow" || f.slot!=="exp") return null;

function isNode(o,t){ return o && typeof o==="object" && o.t===t; }

function T_op(v){ return node("op",{v:v}); }
function T_func(name){ return node("func",{name:name,arg:[]}); }
function T_var(name){ return node("variable",{name:name}); }
function T_const(name){ return node("const",{name:name}); }

function T_pow(b,e){ return node("pow",{base:b||[],exp:e||[]}); }
function T_sqrt(){ return node("sqrt",{body:[]}); }
function T_root(){ return node("root",{n:[],body:[]}); }

function T_sum(){ return node("sum",{lower:[],upper:[],body:[]}); }
function T_prod(){ return node("prod",{lower:[],upper:[],body:[]}); }

/* Calculator errors are thrown, caught at the top of an evaluation and turned

var MAIN_KEYS = [

  {id:"CALC", label:"CALC", shift:"SOLVE", r:1,c:6,s:5},
  {id:"INTG", prim:'<span class="bigop"><span class="sym">\u222b</span></span><span class="intgblk"><span class="kbox sm bound-u"></span><span class="kbox integrand"></span><span class="kbox sm bound-l"></span></span>', shift:'<span class="kfrac-txt"><span class="n">d</span><span class="bar"></span><span class="d">dx</span></span>', r:1,c:21,s:5},
  {id:"XKEY", prim:'<span class="it">x</span>', shift:"\u03a3", r:1,c:26,s:5},

  {id:"FRAC", prim:'<span class="kfrac"><span class="kf-n solid"></span><span class="kf-bar"></span><span class="kf-d"></span></span>', shift:'<span class="kmix"><span class="kbox solid"></span><span class="kfrac sm"><span class="kf-n"></span><span class="kf-bar"></span><span class="kf-d"></span></span></span>', alpha:"\u00f7R", r:2,c:1,s:5},

  {id:"LOG", prim:'log<span class="kcap-sub"><span class="kbox sm"></span></span><span class="kbox"></span>', shift:"10\u02e3", r:2,c:21,s:5},
  {id:"LN", prim:"ln", shift:"e\u02e3", r:2,c:26,s:5},

  {id:"LPAREN", label:"(", shift:"Abs", r:4,c:11,s:5},

  {id:"SD", label:"S\u21d4D", shift:'<span class="kfrac-switch"><span>a</span><span class="kfrac-txt"><span class="n">b</span><span class="bar"></span><span class="d">c</span></span><span>\u21d4</span><span class="kfrac-txt"><span class="n">d</span><span class="bar"></span><span class="d">e</span></span></span>', alpha:"y", r:4,c:21,s:5},

/* ============================ BUILD KEYPAD ============================ */
/* Turns the KEY LAYOUT data into DOM buttons. Every key is one clickable
   <button data-key="ID">, and all input funnels through dispatch(id) so the
   mouse, touch and physical keyboard cannot diverge. */
/* Flat top-control key: an empty plate with the printed name above it. The
   optional shift label sits on the same line, to the right of the name. */
function buildRoundKey(def){
  var cell=document.createElement("div");
  cell.className="keycell";
  cell.style.gridColumn=def.c+"/span "+def.s;
  cell.style.gridRow=String(def.r);
  var btn=document.createElement("button");
  btn.className="key "+(def.cls||"");
  btn.setAttribute("data-key",def.id);
  var aria=[def.label?def.label.replace(/<[^>]+>/g,""):"", def.shift?"shift "+def.shift.replace(/<[^>]+>/g,""):""].join(" ").trim();
  btn.setAttribute("aria-label",aria);
  var lbl=document.createElement("span");
  lbl.className=def.shift?"sl left":"sl center";
  lbl.innerHTML=def.label!==undefined?def.label:def.prim||"";

    var sl=document.createElement("span");
    sl.className="sl right";
    sl.innerHTML=def.shift;
    btn.appendChild(sl);
  }
  cell.appendChild(btn);
  return cell;
}
function buildKey(def){
  var cell=document.createElement("div");
  cell.className="keycell";
  cell.style.gridColumn=def.c+"/span "+def.s;
  cell.style.gridRow=String(def.r);

    var okb=document.createElement("button"); okb.className="dp ok"; okb.setAttribute("data-key","OK"); okb.setAttribute("aria-label","OK"); dp.appendChild(okb);
    cell.appendChild(dp);
    return cell;
  }
  if(/\broundk\b/.test(def.cls||"")){
    return buildRoundKey(def);
  }
  var btn=document.createElement("button");
  btn.className="key "+(def.cls||"");
  btn.setAttribute("data-key",def.id);
  var aria=[def.label?def.label.replace(/<[^>]+>/g,""):"", def.shift?"shift "+def.shift.replace(/<[^>]+>/g,""):"", def.alpha?"alpha "+def.alpha:""].join(" ").trim();

  if(parseInt(cell.style.gridRow,10)<=4) cell.classList.add("fnrow");
});

document.getElementById("padMain").addEventListener("pointerdown",onPointer);
function onPointer(e){
  var t=e.target.closest("[data-key]");
  if(!t) return;
  e.preventDefault();
  var id=t.getAttribute("data-key");
  tapVisual(t);
  dispatch(id);
}
function tapVisual(el){
  el.classList.add("pressed");
  setTimeout(function(){ el.classList.remove("pressed"); },110);
}

/* ============================ DISPLAY HELPERS ============================ */
/* Expression tree -> LCD HTML.
   renderArr()/renderNode() walk the tree; renderNodeAt() is the variant that
   splices the caret into a token at a digit offset, which is what lets the
   caret appear in the middle of a number. slotOrBox() draws one template slot,
   showing the caret while the caret is in that slot and a placeholder box when
   the slot is still empty. opSym/fnSym/constSym map token values to glyphs.
   `hideCaret` is raised while an answer or an error is on screen. */
var LCD=document.getElementById("lcd");
var SCREEN=document.getElementById("screen");

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function num2sup(n){
  var map={"0":"\u2070","1":"\u00b9","2":"\u00b2","3":"\u00b3","4":"\u2074","5":"\u2075","6":"\u2076","7":"\u2077","8":"\u2078","9":"\u2079","-":"\u207b","+":"\u207a"};
  return String(n).split("").map(function(c){return map[c]||c;}).join("");
}

var CARET='<span class="cursor"></span>';
/* while an answer (or an error screen) is on display the caret is suppressed;
   it comes back as soon as the user starts editing again */
var hideCaret=false;
function caretHTML(){ return hideCaret?"":CARET; }
/* draw one token, splicing the caret in at the requested digit offset */
function renderNodeAt(n,at,ctx){
  ctx=baseCtx(ctx);
  if(at===undefined||at===null) return renderNode(n,ctx);
  if(n.t==="num"){
    var s=String(n.v);
    return esc(s.slice(0,at))+caretHTML()+esc(s.slice(at));
  }
  if(at<=0) return caretHTML()+renderNode(n,ctx);
  if(at>=digitsIn(n)) return renderNode(n,ctx)+caretHTML();
  /* A power's digit span is [base][^][exp], so the offset right after the base
     is the "^" itself. The caret can legitimately stand there - that is where
     an exponent merge leaves it - and the markup has to break the node at that
     point, otherwise the caret is drawn past the exponent:
         123^45 with the caret at offset 3  ->  123|45                     */
  if(n.t==="pow"){
    var bd=arrDigits(n.base);          /* NOT slotDigits: its minimum of one
                                          would fire at the wrong offset */
    if(at===bd && arrDigits(n.exp)>0){
      return '<span class="math">'+slotOrBox(n.base)+caretHTML()+renderExponent(n.exp,ctx)+'</span>';
    }
  }
  if(n.t==="paren"||n.t==="abs"){
    if(at===1) return '<span class="math paren">'+caretHTML()+'('+renderArr(n.body,ctx)+')</span>';
    if(at>=2+(n.body?arrDigits(n.body):0)) return '<span class="math paren">('+renderArr(n.body,ctx)+')'+caretHTML()+'</span>';
  }
  if(n.t==="frac"){
    var nd=slotDigits(n.num), dd=slotDigits(n.den), total=nd+dd;
    if(at<=0) return caretHTML()+renderNode(n,ctx);

 *     123^(|^45)     ->  123 ^45        i.e. 123^45   (nothing content-side)
 *
 * Only when there is NO content to move out (an empty or "bare exponent" box)
 * is the whole exponent truly discarded: "123^(|)" -> "123".
 * The caret ends up right of the base, i.e. exactly where the bracket was. */
/* DEL at the START of an exponent box: drop that bracket and let its contents
   move one level out, so nothing typed is lost.
 *
 * The exponent is usually a power of its own ("45^67"): then its CONTENT is
 * that power's base and the HIGHER EXPONENT is that power's exponent. The base
 * absorbs the content and the higher exponent stays an exponent attached to the
 * last content token:
 *
 *     12^(|345^67)  ->  12345^67
 *     123^(|45^67)  ->  12345^67
 *     123^(|45)     ->  12345
 *     123^(|^45)    ->  123^45     (no content, only the higher exponent)
 *     123^(|)       ->  123
 *
 * The caret ends up just right of the base, i.e. where the bracket used to be. */
function mergeExponentIntoBase(node){
  for(var d=stack.length-1;d>0;d--){
    if(stack[d].node===node){
      var parent=stack[d-1];
      stack.length=d;
      var idx=parent.arr.indexOf(node);
      if(idx<0) return;

      var outerBase=node.base, e=node.exp;
      var p=(e.length===1 && e[0] && e[0].t==="pow") ? e[0] : null;
      var content=(p ? p.base : e).slice();     /* what moves out next to the base */
      var higher =(p ? p.exp  : []).slice();    /* what stays an exponent        */

      /* the new base = outer base + content, with `higher` attached to whatever
         ends up last (a fresh power node, never a mutated number) */
      var newBase=outerBase.concat(content);
      if(!newBase.length) newBase=[T_num("0")];  /* never an empty base */
      if(higher.length){
        var last=newBase.pop();
        newBase.push(T_pow([last], higher));
      }
      /* Split the base so that the ORIGINAL base stays its own token(s). The
         caret must sit at the end of the original base, i.e. exactly where the
         deleted bracket began, even when the content ran on into a number:
             123^(|45)    -> 123|45
             123^(|456)   -> 123|456
             123^(|^45)   -> 123|^45
             123^(|45^67) -> 123|45^67      (not 12345|^67)
         "123" and "456" must therefore stay separate tokens - merging them into
         one number would leave the caret no place to stand. */
      splitBaseTokens(outerBase);
      parent.arr.splice.apply(parent.arr,[idx,1].concat(newBase));
      parent.pos=tokenStart(parent.arr,idx)+arrDigits(outerBase);
      return;
    }
  }
}
/* Remove a power's exponent box and keep its base where the power stood.
   Used by DEL at the base's right edge when the box is empty. */
function detachExponent(node){
  for(var d=stack.length-1;d>0;d--){
    if(stack[d].node===node){
      var parent=stack[d-1];
      stack.length=d;
      var idx=parent.arr.indexOf(node);
      if(idx<0) return;
      parent.arr.splice.apply(parent.arr,[idx,1].concat(node.base));
      parent.pos=tokenStart(parent.arr,idx)+arrDigits(node.base);
      return;
    }
  }
}
function unwrapTemplate(node){
  for(var d=stack.length-1;d>0;d--){
    if(stack[d].node===node){
      var parent=stack[d-1];
      stack.length=d;
      var idx=parent.arr.indexOf(node);
      if(idx<0) return;
      /* splice in every slot's contents so nothing typed is lost */
      var ins=[];
      var order=slotKeys(node)||[];
      for(var j=0;j<order.length;j++){
        var part=node[order[j]];
        if(part && part.length) ins=ins.concat(part);
      }
      parent.arr.splice.apply(parent.arr,[idx,1].concat(ins));
      parent.pos=tokenStart(parent.arr,idx)+arrDigits(ins);
      return;
    }
  }
}
function delIntoPreviousSlot(node,fromSlot,order){
  var keys=order||slotKeys(node);
  var i=keys?keys.indexOf(fromSlot):-1;
  for(var k=i-1;k>=0;k--){
    var arr=node[keys[k]];
    if(!arr) continue;
    if(arrDigits(arr)>0){
      stack.pop(); enterEnd(node,keys[k]);
      var f=cur(), np=delDigitIn(f.arr,f.pos);
      if(np>=0) f.pos=np;
      return true;
    }
  }
  return false;
}
function doDel(){
  var c=cur();
  /* --- integral rules -------------------------------------------------------
     The caret walks the integral as integrand -> lower -> upper. DEL follows
     that walk:

       * in the middle of a region it just erases one digit to the left;
       * at the left edge of a later region it erases the last digit of the
         previous region instead (so DEL at the start of the lower bound eats
         the end of the integrand);
       * at the left edge of the FIRST region, i.e. the left edge of the whole
         template, the integral itself is removed - and, because the integrand
         may still hold something, its contents are left behind in the parent
         expression rather than being thrown away.

     "Empty" uses arrDigits(), not slotDigits(): slotDigits() forces a minimum
     of one so empty slots stay reachable by the caret, which would make every
     slot look non-empty here. */
  /* --- power rules ----------------------------------------------------------
     The exponent box is walked in reading order (base, then exponent) and DEL
     never reaches from the exponent into the base as if the "^" were not there.

       * caret at the START of the exponent box: the whole bracket is removed and
         its contents are appended to the base, which is what "drop this level"
         means visually:
             123^(|456)   -> 123456
             123^(|)      -> 123
             123^(|45^67) -> 12345^67
             123^(|^45)   -> 123^45
       * elsewhere inside the exponent: erase one digit of the exponent;
       * at the base's right edge: act on the exponent box (remove it when empty,
         otherwise erase its last digit). */
  var powCtx=null, powInExp=false;
  if(c.node && c.node.t==="pow" && c.slot==="exp"){ powCtx=c.node; powInExp=true; }
  else if(c.node && c.node.t==="pow" && c.slot==="base"){
    /* the base's right edge opens onto the exponent box - including an EMPTY
       one, the case that used to fall through and eat the base's last digit */
    if(c.pos>=arrDigits(c.node.base)){ powCtx=c.node; powInExp=false; }
  }
  if(powCtx){
    if(powInExp && c.pos<=0){ mergeExponentIntoBase(powCtx); return; }
    if(powInExp){
      var npw=delDigitIn(c.arr,c.pos);
      if(npw>=0) c.pos=npw;
      return;
    }
    var hasExp=arrDigits(powCtx.exp)>0;
    if(!hasExp){ detachExponent(powCtx); return; }
    /* from the base side the caret acts at the END of the exponent, next to the
       "^"; the exponent frame may already exist parked at offset 0 */
    var ef=null;
    for(var pd=stack.length-1;pd>0;pd--){
      if(stack[pd].node===powCtx && stack[pd].slot==="exp"){ ef=stack[pd]; break; }
    }
    if(!ef){ ef={arr:powCtx.exp,pos:0,node:powCtx,slot:"exp"}; stack.push(ef); }
    ef.pos=arrDigits(powCtx.exp);
    var enp=delDigitIn(ef.arr,ef.pos);
    if(enp>=0) ef.pos=enp;
    return;
  }
  var intNode=(c.node && c.node.t==="intg" && (c.slot==="body"||c.slot==="lower"||c.slot==="upper")) ? c.node : null;
  /* At offset 0 the caret sits BEFORE the node's first character, so tokenAt()
     cannot see it; the enclosing template is still known from the frame. */
  if(!intNode){
    for(var d=stack.length-1;d>0;d--){
      var fr=stack[d];
      if(fr.pos<=0 && fr.node && fr.node.t==="intg"){ intNode=fr.node; c=fr; break; }
    }
  }
  if(intNode){
    if(c.pos>0){
      var np0=delDigitIn(c.arr,c.pos);
      if(np0>=0) c.pos=np0;
      return;
    }
    /* at the left edge of this region: walk backwards through the PRINTED
       order, or drop the template when nothing is left of it. The caret path is
       always [node, slot] at this point (tokenAt found the node, or the frame
       loop below did), so popping one frame rewinds into the node's parent. */
    if(delIntoPreviousSlot(intNode,c.slot)) return;
    detachIntegral(intNode);
    return;
  }
  if(c.pos>0){
    /* caret sitting just right of a template: step back inside it and delete
       its last digit, so "⌐12/34 |" + DEL leaves 12/3 instead of dropping the
       whole fraction */
    var edge=tokenAtTrailingEdge(c.arr,c.pos);
    var ek=edge?lastSlot(edge):null;
    if(ek){
      enterEnd(edge,ek);
      var ef=cur(), nep=delDigitIn(ef.arr,ef.pos);
      if(nep>=0) ef.pos=nep; else leaveField(1);
      return;
    }
    var np=delDigitIn(c.arr,c.pos);
    if(np>=0) c.pos=np;
    return;
  }
  if(stack.length<=1) return;
  /* at the head of a template slot: step back into the previous slot and
     delete its last digit, instead of dropping the whole template */
  for(var i=stack.length-1;i>0;i--){
    var keys=slotKeys(stack[i].node);
    var ki=keys?keys.indexOf(stack[i].slot):-1;
    if(ki<=0) continue;                       /* not a slot, or the first one */
    var tnode=stack[i].node;
    stack.length=i;                           /* drop the frames inside the template */
    enterEnd(tnode,keys[ki-1]);
    var f=cur();
    if(f.pos>0){ var np2=delDigitIn(f.arr,f.pos); if(np2>=0) f.pos=np2; }
    return;
  }
  var ff=stack.pop(), p=cur();
  var idx=p.arr.indexOf(ff.node);
  if(idx>=0){ p.arr.splice(idx,1); p.pos=tokenStart(p.arr,idx); }
  else p.pos=0;
}
/* UP / DOWN keep the digit offset when they move between the slots of the
   template the cursor is inside, so ⌐12 with the caret after the "1" lands
   after the first digit of the denominator too. At either end of the slot list
   they step out of the template; false means "no enclosing template" so the
   caller can fall back to history recall. */
function doField(dir){
  var c=cur(), keys=slotKeys(c.node);
  var i=keys?keys.indexOf(c.slot):-1;
  if(i>=0){
    var j=i+dir;
    if(j<0 || j>=keys.length){
      if(stack.length>1){ leaveField(dir); return true; }
      return false;
    }
    var want=c.pos;                        /* digit offset to keep across slots */
    stack.pop(); enter(c.node,keys[j]);
    var t=cur();
    t.pos=Math.max(0,Math.min(want,arrDigits(t.arr)));   /* real offset inside the slot */
    return true;
  }
  /* Not inside a template: DOWN moves forward like RIGHT and descends into the
     composite node the caret lands in, so "⌐12/34 ⇥ |" re-enters the fraction
     rather than doing nothing. */
  if(dir>0){
    var tot=arrDigits(c.arr);
    if(c.pos<tot){
      c.pos++;
      descendAtCursor();
      return true;
    }
    if(stack.length>1){
      var f2=stack[stack.length-1];
      var k2=slotKeys(f2.node);
      if(k2){
        var ki2=k2.indexOf(f2.slot);
        if(ki2>=0 && ki2<k2.length-1){ stack.pop(); enter(f2.node,k2[ki2+1]); return true; }
      }
      leaveField(1);
      return true;
    }
  }
  return false;
}

/* input tokens */
/* the caret is at the end of the array AND just after a number token: that
   number is the one further digits should extend */
function caretAtEnd(c){ return c.pos>=arrDigits(c.arr); }

function numToExtend(c){
  if(!caretAtEnd(c)) return null;

/* ============================ EVALUATOR ============================ */
/* Expression tree -> value, independent of the DOM.
   The real and complex paths share one code path: every c* helper below
   accepts either a plain number or a {re,im} pair, so plain arithmetic never
   pays for complex support. evaluateList() is a small recursive-descent parser
   over the token array; trig/log helpers apply the current angle unit. */
function getVar(name){
  if(name==="Ans") return S.hasAns?S.ans:0;

function angToRad(x){

}

  if(S.angle==="DEG") return x*180/Math.PI;

function isC(x){ return x && typeof x==="object" && x.re!==undefined; }
function mkC(re,im){ return {re:re,im:im||0}; }
function toC(x){ return isC(x)?x:mkC(x,0); }
function cadd(a,b){ if(!isC(a)&&!isC(b)) return a+b; a=toC(a);b=toC(b); return mkC(a.re+b.re,a.im+b.im); }
function csub(a,b){ if(!isC(a)&&!isC(b)) return a-b; a=toC(a);b=toC(b); return mkC(a.re-b.re,a.im-b.im); }
function cmul(a,b){ if(!isC(a)&&!isC(b)) return a*b; a=toC(a);b=toC(b); return mkC(a.re*b.re-a.im*b.im, a.re*b.im+a.im*b.re); }

  var r=Math.sqrt(a.re*a.re+a.im*a.im); if(r===0) throw err("Math ERROR"); return mkC(Math.log(r),Math.atan2(a.im,a.re));

    var r=Math.pow(a,b); if(isNaN(r)) throw err("Math ERROR"); return r;

  if(!isC(a) && a===0){ if(isC(b)){ if(b.im===0&&b.re>0) return 0; throw err("Math ERROR"); } if(b===0) return 1; return 0; }

  if(!isC(a)){ if(a<0 && S.mode==="CMPLX") return mkC(0,Math.sqrt(-a)); if(a<0) throw err("Math ERROR"); return Math.sqrt(a); }
  var r=Math.sqrt(cabs(a)); var t=Math.atan2(a.im,a.re)/2; return mkC(r*Math.cos(t),r*Math.sin(t));

  if(isC(x) && Math.abs(x.im)>1e-12) throw err("Math ERROR");
  var v=x.re!==undefined?x.re:x;
  if(!isInt(v) || v<0) throw err("Math ERROR");
  if(v>170) throw err("Range ERROR");

function toNumForTrig(x){ if(isC(x)) throw err("Math ERROR"); return angToRad(x); }

function applyFunc(name,arg){
  switch(name){
    case "sin": return isC(arg)?csin(arg):Math.sin(angToRad(arg));
    case "cos": return isC(arg)?ccos(arg):Math.cos(angToRad(arg));
    case "tan": var t=Math.tan(angToRad(isC(arg)?0:arg)); if(!isC(arg)&&S.angle==="DEG"&&Math.abs(Math.cos(angToRad(arg)))<1e-12) throw err("Math ERROR"); return isC(arg)?ctan(arg):t;

    case "atan": if(isC(arg)) throw err("Math ERROR"); return radToAng(Math.atan(arg));
    case "sinh": return isC(arg)?cdiv(csub(cexp(arg),cexp(cneg(arg))),2):Math.sinh(arg);
    case "cosh": return isC(arg)?cdiv(cadd(cexp(arg),cexp(cneg(arg))),2):Math.cosh(arg);
    case "tanh": return isC(arg)?cdiv(csinh(arg),ccosh(arg)):Math.tanh(arg);
    case "asinh": return Math.asinh(arg);
    case "acosh": if(arg<1) throw err("Math ERROR"); return Math.acosh(arg);
    case "atanh": if(arg<=-1||arg>=1) throw err("Math ERROR"); return Math.atanh(arg);
    case "log": return isC(arg)?cdiv(cln(arg),Math.LN10):(arg<=0?throwErr():Math.log10(arg));
    case "ln": return cln(arg);
    case "sqrt": return csqrt(arg);
    case "cbrt": return isC(arg)?cpow(arg,1/3):Math.cbrt(arg);
    case "abs": return cabs(arg);
    case "arg": if(!isC(arg)) arg=toC(arg); return radToAng(Math.atan2(arg.im,arg.re));
    case "conj": if(!isC(arg)) return arg; return mkC(arg.re,-arg.im);
    case "re": return isC(arg)?arg.re:arg;
    case "im": return isC(arg)?arg.im:0;
    case "rnd": return Math.round(arg);
    case "ranint": return Math.floor(Math.random()*arg)+1;
    case "not": return ~(Math.round(arg));
    case "fact": return primeFactor(Math.round(arg));
    case "min": return arg;
    case "max": return arg;
    case "f2c": return (arg-32)*5/9;
    case "c2f": return arg*9/5+32;
  }
  function csinh(x){ return cdiv(csub(cexp(x),cexp(cneg(x))),2); }
  function ccosh(x){ return cdiv(cadd(cexp(x),cexp(cneg(x))),2); }
  function throwErr(){ throw err("Math ERROR"); }
  throw err("Syntax ERROR");
}
function primeFactor(n){
  n=Math.abs(Math.round(n));
  if(n<2) return n;
  var out=[]; var d=2;
  while(n>1 && d*d<=n){ while(n%d===0){ out.push(d); n/=d; } d+=(d===2?1:2); }
  if(n>1) out.push(n);
  return out.join("\u00d7");
}

function evaluateList(arr,ctxVar){
  var i=0;
  function peek(){ return arr[i]; }
  function next(){ return arr[i++]; }
  function startsFactor(t){
    if(!t) return false;
    return ["num","variable","const","func","frac","pow","sqrt","root","paren","abs","post","logbase","intg","deriv","sum","prod"].indexOf(t.t)>=0;
  }
  function parseExpr(){
    var left=parseTerm();
    while(peek() && peek().t==="op" && (peek().v==="+"||peek().v==="-")){
      var op=next().v; var right=parseTerm(); left=cadd(left, op==="+"?right:cneg(right));
    }
    return left;
  }
  function parseTerm(){
    var left=parseUnary();
    while(true){
      var t=peek();
      if(!t) break;
      if(t.t==="op" && (t.v==="*"||t.v==="/")){
        next(); var r=parseUnary(); left = t.v==="*"?cmul(left,r):cdiv(left,r);
      } else if(t.t==="op" && (t.v==="P"||t.v==="C")){
        next(); var r2=parseUnary(); left = t.v==="P"?cperm(left,r2):ccomb(left,r2);
      } else if(startsFactor(t)){
        var r3=parseUnary(); left=cmul(left,r3);
      } else if(t.t==="op" && t.v==="\u2220"){
        next(); var r4=parseUnary();
        var rr=left, th=(isC(r4)?r4.re:r4);
        if(S.angle==="DEG") th=th*Math.PI/180; else if(S.angle==="GRA") th=th*Math.PI/200;
        left = mkC(rr*Math.cos(th), rr*Math.sin(th));
      } else break;
    }
    return left;
  }
  function parseUnary(){
    var t=peek();
    if(t && t.t==="op" && t.v==="-"){ next(); return cneg(parseUnary()); }
    if(t && t.t==="op" && t.v==="+"){ next(); return parseUnary(); }
    return parsePower();
  }
  function parsePower(){
    var base=parsePostfix();
    if(peek() && peek().t==="op" && peek().v==="^"){
      next(); var exp=parseUnary(); return cpow(base,exp);
    }
    return base;
  }
  function parsePostfix(){
    var v=parseAtom();
    while(peek()){
      var t=peek();
      if(t.t==="post" && t.v==="!"){ next(); v=cfact(v); }
      else if(t.t==="post" && t.v==="%"){ next(); v=cdiv(v,100); }
      else if(t.t==="post" && (t.v==="\u00b0"||t.v==="\u2019"||t.v==="\u201d")){ next(); }
      else break;
    }
    return v;
  }
  function parseAtom(){
    var t=next();
    if(!t) throw err("Syntax ERROR");
    switch(t.t){
      case "num": return t.base?parseInt(t.v||"0",t.base):parseFloat(t.v===""?"0":t.v);
      case "variable": return getVar(t.name);
      case "const":
        if(t.name==="PI") return Math.PI;
        if(t.name==="e"||t.name==="euler") return Math.E;
        if(t.name==="i"){ if(S.mode!=="CMPLX") throw err("Syntax ERROR"); return mkC(0,1); }
        if(t.name==="Ans") return S.hasAns?S.ans:0;
        if(t.name==="M") return S.M;
        throw err("Variable ERROR");
      case "func": return applyFunc(t.name, evaluateList(t.arg));
      case "paren": return evaluateList(t.body);
      case "abs": return cabs(evaluateList(t.body));
      case "frac": { var n=evaluateList(t.num), d=evaluateList(t.den); return cdiv(n,d); }
      case "mixed": { var w=evaluateList(t.whole), n2=evaluateList(t.num), d2=evaluateList(t.den); return cadd(w,cdiv(n2,d2)); }
      case "pow": return cpow(evaluateList(t.base), evaluateList(t.exp));
      case "sqrt": return csqrt(evaluateList(t.body));
      case "root": { var n=evaluateList(t.n), b=evaluateList(t.body); if(n==2) return csqrt(b); return cpow(b,cdiv(1,n)); }
      case "logbase": { var bb=evaluateList(t.base), ar=evaluateList(t.arg); return cdiv(cln(ar),cln(bb)); }
      case "post": throw err("Syntax ERROR");
      case "intg": return evalIntegral(t);
      case "deriv": return evalDerivative(t);
      case "sum": return evalSeries(t,false);
      case "prod": return evalSeries(t,true);
      case "op":
        if(t.v==="-"||t.v==="+"){ return t.v==="-"?cneg(parseUnary()):parseUnary(); }
        throw err("Syntax ERROR");
    }
    throw err("Syntax ERROR");
  }
  var val=parseExpr();
  if(i<arr.length) throw err("Syntax ERROR");
  return val;
}

function evalWithVar(arr,varName,val){
  var old=S.vars[varName]; S.vars[varName]=val;
  try{ var r=evaluateList(arr); S.vars[varName]=old; return r; }
  catch(e){ S.vars[varName]=old; throw e; }
}
function real(v){ if(isC(v)){ if(Math.abs(v.im)>1e-10) throw err("Math ERROR"); return v.re; } return v; }
function evalIntegral(t){
  var a=real(evaluateList(t.lower)), b=real(evaluateList(t.upper));
  if(a===b) return 0;
  var n=400; if(n%2) n++;
  var h=(b-a)/n;
  if(h===0) return 0;
  var varName=t.var||"X";
  var f0=real(evalWithVar(t.body,varName,a));
  var fn=real(evalWithVar(t.body,varName,b));
  var s=f0+fn, ok=true;
  for(var i=1;i<n;i++){
    var x=a+i*h;
    var y=real(evalWithVar(t.body,varName,x));
    if(!isFinite(y)){ ok=false; break; }
    s+=y*(i%2?4:2);
  }
  if(!ok) throw err("Math ERROR");
  return s*h/3;
}
function evalDerivative(t){
  var a=real(evaluateList(t.at));
  var varName=t.var||"X";
  var h=1e-5*(1+Math.abs(a));
  var y1=real(evalWithVar(t.body,varName,a+h));
  var y2=real(evalWithVar(t.body,varName,a-h));
  return (y1-y2)/(2*h);
}
function evalSeries(t,isProd){
  var a=real(evaluateList(t.lower)), b=real(evaluateList(t.upper));
  if(a>b) return isProd?1:0;
  if(Math.abs(b-a)>1e5) throw err("Range ERROR");
  var varName=t.var||"X";
  var acc=isProd?1:0;
  for(var k=a;k<=b;k++){
    var v=real(evalWithVar(t.body,varName,k));
    acc=isProd?cmul(acc,v):cadd(acc,v);
  }
  return acc;
}

    case "MATRIX": return [it("define","Define Matrix"),it("det","Determinant"),it("inv","Inverse"),it("trn","Transpose"),it("add","MatA+MatB"),it("sub","MatA\u2212MatB"),it("mul","MatA\u00d7MatB")];

var SETUP_PER_PAGE=4;
function settingsItems(){
  return [
    {id:"io",label:"Input/Output : "+S.io},
    {id:"angle",label:"Angle Unit : "+S.angle},
    {id:"fmt",label:"Number Format : "+S.fmt.mode},
    {id:"frac",label:"Fraction Result : "+(S.fracResult?"On":"Off")},
    {id:"reset",label:"Reset"},
    {id:"exit",label:"Exit"}
  ];
}
function handleMenuKey(id){
  var m=S.menu; if(!m) return;
  if(id==="ON"){ S.menu=null; render(); return; }
  if(id==="MENU"){ S.menu=null; render(); return; }
  if(id==="AC"){ S.menu=null; render(); return; }
  if(id==="UP"||id==="DOWN"||id==="LEFT"||id==="RIGHT"){
    var cols=m.cols||1;
    if(id==="UP") m.index=Math.max(0,m.index-cols);
    if(id==="DOWN") m.index=Math.min(m.items.length-1,m.index+cols);
    if(id==="LEFT") m.index=Math.max(0,m.index-1);
    if(id==="RIGHT") m.index=Math.min(m.items.length-1,m.index+1);
    render(); return;
  }
  if(id==="EQUALS"){ selectMenuItem(); return; }
  if(/^[0-9]$/.test(id)){
    var n=parseInt(id,10);
    var idx;
    if(m.type==="SETUP"){
      var pageStart=Math.floor(m.index/SETUP_PER_PAGE)*SETUP_PER_PAGE;
      idx=pageStart+((id==="0")?9:(n-1));
    } else {
      idx=(id==="0")?9:(n-1);
    }
    if(idx>=0 && idx<m.items.length){ m.index=idx; selectMenuItem(); }
    return;
  }
  if(id==="DEL"||id==="SHIFT"){ m.index=Math.max(0,m.index-1); render(); }
}
function selectMenuItem(){
  var m=S.menu, item=m.items[m.index];
  if(m.type==="MAIN"){
    S.menu=null; setMode(item.id); return;
  }
  if(m.type==="OPTN"){
    S.menu=null; doOptionAction(item.id); return;
  }
  if(m.type==="SETUP"){
    doSetup(item.id); return;
  }
  if(m.type==="CONST"){
    S.menu=null; startFreshIfResult(); ins(T_num(String(item.val))); render(); return;
  }
  if(m.type==="CONV"){
    S.menu=null; startFreshIfResult();
    var c=cur(); if(leftToken(c.arr,c.pos)) ins(T_op("*"));
    if(item.id==="\u00b0F\u2192\u00b0C") ins(T_func("f2c"));
    else if(item.id==="\u00b0C\u2192\u00b0F") ins(T_func("c2f"));
    else ins(T_num(String(item.val)));
    render(); return;
  }
  if(m.type==="VAR"){
    S.menu=null; startFreshIfResult(); ins(T_var(item.id)); render(); return;
  }
  if(m.type==="RESET"){
    if(item.id==="settings"){ resetSettings(); }
    else if(item.id==="memory"){ resetMemory(); }
    else { resetSettings(); resetMemory(); clearInput(); }
    S.menu=null; S.message="Reset done"; render(); return;
  }
}

/* ============================ SETTINGS ============================ */
/* The SETUP menu actions (angle unit, input/output, number format, fraction
   result) and the two reset helpers. */
function doSetup(id){
  var m=S.menu;
  if(id==="angle"){
    var order=["DEG","RAD","GRA"]; S.angle=order[(order.indexOf(S.angle)+1)%3];
  } else if(id==="io"){
    S.io=S.io==="MATH"?"LINE":"MATH";
  } else if(id==="fmt"){
    var order2=[["NORM",2],["FIX",2],["SCI",6]];
    var idx=0; for(var i=0;i<order2.length;i++) if(order2[i][0]===S.fmt.mode) idx=i;
    var nx=order2[(idx+1)%order2.length]; S.fmt={mode:nx[0],digits:nx[1]};
  } else if(id==="frac"){
    S.fracResult=!S.fracResult;
  } else if(id==="reset"){
    S.menu=null; openMenu("RESET"); return;
  } else if(id==="exit"){
    S.menu=null; render(); return;
  }
  m.items=settingsItems(); render();
}
function resetSettings(){ S.angle="DEG"; S.io="MATH"; S.fmt={mode:"NORM",digits:2}; S.fracResult=true; }
function resetMemory(){ for(var k in S.vars) S.vars[k]=0; S.M=0; S.ans=0; S.hasAns=false; S.history=[]; }

/* ============================ BASE-N ============================ */
/* Radix conversion for BASE mode: values are drawn with baseString() and typed
   digits are parsed with the current base. */
var BASES={dec:10,hex:16,bin:2,oct:8};
function baseString(v,base){
  var x=Math.round(v);
  if(!isFinite(x)) throw err("Math ERROR");
  var neg=x<0; x=Math.abs(x);
  var s=x.toString(base).toUpperCase();
  return (neg?"-":"")+s;
}
function baseSub(base){ var m={10:"10",16:"16",2:"2",8:"8"}; return m[base]||String(base); }
function parseBase(str,base){ var n=parseInt(str,base); if(isNaN(n)) throw err("Syntax ERROR"); return n; }

/* ============================ MATRIX ============================ */
/* Dense 1x1..4x4 matrices held as arrays of rows. Pure maths only - no DOM:
   add/sub/mul, determinant, adjugate inverse and transpose. */
function matIdent(n){ var m=[]; for(var i=0;i<n;i++){ var row=[]; for(var j=0;j<n;j++) row.push(i===j?1:0); m.push(row);} return m; }
function matAdd(a,b){ if(a.length!==b.length||a[0].length!==b[0].length) throw err("Dimension ERROR"); return a.map(function(r,i){return r.map(function(v,j){return v+b[i][j];});}); }
function matSub(a,b){ return a.map(function(r,i){return r.map(function(v,j){return v-b[i][j];});}); }
function matMul(a,b){ if(a[0].length!==b.length) throw err("Dimension ERROR"); var out=[]; for(var i=0;i<a.length;i++){ var row=[]; for(var j=0;j<b[0].length;j++){ var s=0; for(var k=0;k<b.length;k++) s+=a[i][k]*b[k][j]; row.push(s);} out.push(row);} return out; }
function matScalar(a,s){ return a.map(function(r){return r.map(function(v){return v*s;});}); }
function matDet(a){
  var n=a.length; if(n!==a[0].length) throw err("Dimension ERROR");
  if(n===1) return a[0][0];
  if(n===2) return a[0][0]*a[1][1]-a[0][1]*a[1][0];
  var d=0; for(var c=0;c<n;c++){ d+=Math.pow(-1,c)*a[0][c]*matDet(minor(a,0,c)); } return d;
}
function minor(a,r,c){ var out=[]; for(var i=0;i<a.length;i++){ if(i===r) continue; var row=[]; for(var j=0;j<a[i].length;j++){ if(j===c) continue; row.push(a[i][j]); } out.push(row);} return out; }
function matInv(a){
  var n=a.length; if(n!==a[0].length) throw err("Dimension ERROR");
  var M=a.map(function(r){return r.slice();}), I=matIdent(n);
  for(var col=0;col<n;col++){
    var piv=col; for(var r=col+1;r<n;r++) if(Math.abs(M[r][col])>Math.abs(M[piv][col])) piv=r;
    if(Math.abs(M[piv][col])<1e-12) throw err("Math ERROR");
    var tmp=M[col];M[col]=M[piv];M[piv]=tmp; tmp=I[col];I[col]=I[piv];I[piv]=tmp;
    var pv=M[col][col];
    for(var j=0;j<n;j++){ M[col][j]/=pv; I[col][j]/=pv; }
    for(var r2=0;r2<n;r2++){ if(r2===col) continue; var f=M[r2][col]; if(f===0) continue; for(var j2=0;j2<n;j2++){ M[r2][j2]-=f*M[col][j2]; I[r2][j2]-=f*I[col][j2]; } }
  }
  return I.map(function(r){return r.map(function(v){return Math.abs(v)<1e-12?0:v;});});
}
function matTrn(a){ var out=[]; for(var j=0;j<a[0].length;j++){ var row=[]; for(var i=0;i<a.length;i++) row.push(a[i][j]); out.push(row);} return out; }

/* ============================ VECTOR ============================ */
/* 2D/3D vectors as plain arrays: add/sub, dot, cross, norm. */
function vAdd(a,b){ if(a.length!==b.length) throw err("Dimension ERROR"); return a.map(function(v,i){return v+b[i];}); }
function vSub(a,b){ return a.map(function(v,i){return v-b[i];}); }
function vDot(a,b){ if(a.length!==b.length) throw err("Dimension ERROR"); var s=0; for(var i=0;i<a.length;i++) s+=a[i]*b[i]; return s; }
function vCross(a,b){ if(a.length!==3||b.length!==3) throw err("Dimension ERROR"); return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]; }
function vNorm(a){ return Math.sqrt(vDot(a,a)); }

/* ============================ STATISTICS ============================ */
/* STAT mode maths: 1-variable and 2-variable summaries plus the linear
   regression coefficients. */
function statValues(){
  var rows=S.stat.rows.filter(function(r){ return r[0]!=="" || (S.stat.type==="2var" && r[1]!==""); });
  var xs=[],ys=[];
  rows.forEach(function(r){ var x=parseFloat(r[0]); if(isNaN(x)) return; xs.push(x); if(S.stat.type==="2var"){ var y=parseFloat(r[1]); if(!isNaN(y)) ys.push(y);} });
  return {xs:xs,ys:ys,rows:rows.length};
}
function statCalc(){
  var d=statValues(); var xs=d.xs, ys=d.ys;
  if(!xs.length) throw err("Math ERROR");
  function mean(a){ return a.reduce(function(s,v){return s+v;},0)/a.length; }
  function sqmean(a,m){ return a.reduce(function(s,v){return s+(v-m)*(v-m);},0); }
  var mx=mean(xs), my=ys.length?mean(ys):0;
  var res={n:xs.length,sumx:xs.reduce(function(s,v){return s+v;},0),mx:mx,
    sx:Math.sqrt(sqmean(xs,mx)/(xs.length-1||1)), px:Math.sqrt(sqmean(xs,mx)/xs.length)};
  if(S.stat.type==="2var" && ys.length){
    res.sumy=ys.reduce(function(s,v){return s+v;},0); res.my=my;
    res.sy=Math.sqrt(sqmean(ys,my)/(ys.length-1||1)); res.py=Math.sqrt(sqmean(ys,my)/ys.length);
    var sxy=0,sxx=0,syy=0;
    for(var i=0;i<xs.length;i++){ sxy+=(xs[i]-mx)*(ys[i]-my); sxx+=(xs[i]-mx)*(xs[i]-mx); syy+=(ys[i]-my)*(ys[i]-my); }
    res.a=sxy/sxx; res.b=my-res.a*mx; res.r=sxy/Math.sqrt(sxx*syy);
  }
  return res;
}
function solveLinear(A,b){
  var n=A.length; var M=A.map(function(r,i){return r.concat([b[i]]);});
  for(var col=0;col<n;col++){
    var piv=col; for(var r=col+1;r<n;r++) if(Math.abs(M[r][col])>Math.abs(M[piv][col])) piv=r;
    if(Math.abs(M[piv][col])<1e-12) throw err("Math ERROR");
    var t=M[col];M[col]=M[piv];M[piv]=t;
    var pv=M[col][col];
    for(var j=col;j<=n;j++) M[col][j]/=pv;
    for(var r2=0;r2<n;r2++){ if(r2===col) continue; var f=M[r2][col]; for(var j2=col;j2<=n;j2++) M[r2][j2]-=f*M[col][j2]; }
  }
  return M.map(function(r){return r[n];});
}
function polyRoots(coeff){
  var c=coeff.slice();
  while(c.length>1 && Math.abs(c[0])<1e-14) c.shift();
  var n=c.length-1;
  if(n<1) throw err("Math ERROR");
  var roots=[]; var r=[]; for(var i=0;i<n;i++) r.push({re:0.4,im:0.9+0.1*i});
  function evalP(z){ var out=mkC(0,0); for(var i=0;i<c.length;i++){ out=cadd(cmul(out,z),c[i]); } return out; }
  for(var iter=0;iter<200;iter++){
    var maxd=0;
    for(var i=0;i<n;i++){
      var num=evalP(r[i]); var den=mkC(1,0);
      for(var j=0;j<n;j++){ if(j!==i) den=cmul(den,csub(r[i],r[j])); }
      var d=cdiv(num,den); r[i]=csub(r[i],d);
      maxd=Math.max(maxd,cabs(d));
    }
    if(maxd<1e-13) break;
  }
  return r.map(function(z){ return Math.abs(z.im)<1e-7?mkC(z.re,0):z; });
}

/* ============================ (re)RESOLVE CONSTANT CONV ============================ */
/* Look up a scientific constant or unit-conversion factor by name, used by the
   CONST and CONV menus. */
function convConstValue(name){
  for(var i=0;i<CONV_LIST.length;i++){
    if(("CONV:"+CONV_LIST[i][0])===name){
      var c=CONV_LIST[i];
      if(c[3]==="f2c") return function(x){ return (x-32)*5/9; };
      if(c[3]==="c2f") return function(x){ return x*9/5+32; };
      return c[2];
    }
  }
  return null;
}

/* ============================ RENDER ============================ */
/* One entry point, render(), which dispatches on the current mode, and one
   draw function per screen: calculation, menus, matrix, vector, statistics,
   table, equation, inequality and ratio. renderStatus() paints the status bar
   indicators above them. These read state and write HTML only. */
function render(){
  var calcEl=document.getElementById("calc");
  if(calcEl){
    calcEl.classList.toggle("shift-on",!!S.shift);
    calcEl.classList.toggle("alpha-on",!!S.alpha);
  }
  if(!S.power){ LCD.classList.add("power-off"); SCREEN.innerHTML=""; renderStatus(); return; }
  LCD.classList.remove("power-off");
  renderStatus();
  if(S.menu){ renderMenu(); return; }
  if(S.error){ renderError(); return; }
  if(S.message && (S.mode==="CALC"||S.mode==="CMPLX"||S.mode==="BASE")){ renderError(); return; }
  switch(S.mode){
    case "CALC": case "CMPLX": case "BASE": renderExprScreen(); break;
    case "MATRIX": renderMatrix(); break;
    case "VECTOR": renderVector(); break;
    case "STAT": renderStat(); break;
    case "TABLE": renderTable(); break;
    case "EQUATION": renderEquation(); break;
    case "INEQ": renderIneq(); break;
    case "RATIO": renderRatio(); break;
  }
}

/* The real bounding box of the rendered expression, measured from the DOM.
 * Nested exponents use a relative offset, so the browser's idea of the line
 * height is smaller than what is actually drawn; this is what tells us how far
 * the drawing sticks out above the line box. */
function calculateExpressionBounds(el){
  var wrap=el.parentElement;
  if(!wrap) return null;
  var wr=wrap.getBoundingClientRect();
  var box={top:Infinity,bottom:-Infinity,left:Infinity,right:-Infinity};
  var parts=el.querySelectorAll(".sup,.math,.num,.cursor");
  if(!parts || !parts.length) parts=[el];
  for(var i=0;i<parts.length;i++){
    var r=parts[i].getBoundingClientRect();
    if(!r.width && !r.height) continue;
    if(r.top    <box.top)    box.top   =r.top;
    if(r.bottom >box.bottom) box.bottom=r.bottom;
    if(r.left   <box.left)   box.left  =r.left;
    if(r.right  >box.right)  box.right =r.right;
  }
  if(box.top===Infinity) return null;
  box.top-=wr.top; box.bottom-=wr.top; box.left-=wr.left; box.right-=wr.left;
  box.wrapHeight=wr.height; box.wrapWidth=wr.width;
  return box;
}
/* Keep the CARET inside the LCD. The expression is offset only as far as the
 * caret needs, and only when it would otherwise leave the visible area; the
 * offset is clamped so a very tall tower of exponents can never push the line
 * completely off screen. The caret wins over the rest of the expression. */
var MAX_VERTICAL_SHIFT=60;
function ensureCursorVisible(el){
  if(!el) return;
  var c=el.querySelector(".cursor");
  if(c && c.scrollIntoView) try{ c.scrollIntoView({block:"nearest",inline:"nearest"}); }catch(e){}
  if(!c){ el.style.transform=""; return; }
  var bounds=calculateExpressionBounds(el);
  if(!bounds) return;
  var cr=c.getBoundingClientRect();
  var wrap=el.parentElement.getBoundingClientRect();
  var pad=4;
  var caretTop=cr.top-wrap.top, caretBottom=cr.bottom-wrap.top;
  var shift=0;
  if(caretTop<pad) shift=pad-caretTop;
  else if(caretBottom>bounds.wrapHeight-pad) shift=bounds.wrapHeight-pad-caretBottom;
  if(shift>MAX_VERTICAL_SHIFT) shift=MAX_VERTICAL_SHIFT;
  if(shift<-MAX_VERTICAL_SHIFT) shift=-MAX_VERTICAL_SHIFT;
  if(shift) el.style.transform="translateY("+shift.toFixed(1)+"px)";
  else el.style.transform="";
}

      html+='<span style="display:inline-block;min-width:36px;border:1px solid rgba(32,38,26,.4);margin:2px;text-align:center;'+(sel2?"box-shadow:inset 0 0 0 2px var(--lcd-ink);":"")+'">'+(sel2&&e.buf!==null?esc(e.buf):esc(String(e.coeff[k])))+'</span>'+(pw2===0?"":("x"+(pw2>1?'<sup>'+pw2+'</sup>':"")))+(k<=e.n-1?' + ':'');
    }
    html+=' '+'<b>'+esc(e.sign)+'</b> 0</div>';
    if(e.result) html+='<div class="stat-res" style="margin-top:6px">'+e.result+'</div>';
    html+='<div class="prompt" style="font-size:9px;margin-top:4px">Arrows: move \u00b7 = : confirm</div>';
  }
  html+='</div>';
  SCREEN.innerHTML=html;
}
function renderRatio(){
  var r=S.ratio;
  var html='<div class="exprwrap">';
  html+='<div class="panel-title">RATIO  A : B = C : D</div>';
  html+='<div style="font-size:14px;display:flex;align-items:center;gap:6px;margin-top:6px">';
  for(var i=0;i<4;i++){
    if(i===1||i===3) html+='<span style="font-size:16px">'+(i===1?"=":":")+'</span>';
    var sel=i===r.sel;
    var val=(r.cells[i]===null)?"?":((sel&&r.buf!==null)?r.buf:r.cells[i]);
    html+='<span style="display:inline-block;min-width:44px;border:1px solid rgba(32,38,26,.5);text-align:center;padding:2px 4px;'+(sel?"box-shadow:inset 0 0 0 2px var(--lcd-ink);":"")+'">'+esc(val)+'</span>';
  }
  html+='</div>';
  if(r.result) html+='<div class="stat-res" style="margin-top:6px">'+r.result+'</div>';
  html+='<div class="prompt" style="font-size:9px;margin-top:4px">Arrows: move \u00b7 = : confirm  (leave one blank)</div>';
  html+='</div>';
  SCREEN.innerHTML=html;
}

/* ============================ CLEAR / ANS ============================ */
/* The commands behind the CALC, = and STO keys: evaluate the expression and
   push it to history, store a variable, and the numerical SOLVE used by
   SHIFT+CALC. */
function doEquals(){
  if(S.mode==="TABLE"){ tableEquals(); return; }
  if(S.mode==="MATRIX"||S.mode==="VECTOR"||S.mode==="STAT"||S.mode==="EQUATION"||S.mode==="INEQ"||S.mode==="RATIO"){
    if(S.mode==="MATRIX"&&S.matrix.edit){ return matrixConfirm(); }
    if(S.mode==="VECTOR"&&S.vector.edit){ return vectorConfirm(); }
    if(S.mode==="STAT"&&S.stat.type){ return statConfirm(); }
    if(S.mode==="EQUATION"||S.mode==="INEQ"){ return eqConfirm(); }
    if(S.mode==="RATIO"){ return ratioConfirm(); }
    return;
  }
  try{
    var val=evaluateList(root);
    S.ans=val; S.hasAns=true;
    S.resultHTML=formatValue(val);
    S.resultShown=true;
    S.lastExpr=JSON.parse(JSON.stringify(root));
    S.history.push({expr:JSON.parse(JSON.stringify(root)),val:val});
    S.histIndex=-1;                 /* the newest entry is recalled on the next UP */
  }catch(e){
    S.error=(e&&e.msg)?e.msg:("Syntax ERROR");
  }
  render();
}
function doStore(name){
  S.stoPending=false;
  try{
    var val;
    if(S.resultShown && S.hasAns) val=S.ans;
    else val=evaluateList(root);
    if(name==="M"){ S.M=isC(val)?val.re:val; }
    else S.vars[name]=isC(val)?val.re:val;
    S.ans=val; S.hasAns=true; S.resultShown=true; S.resultHTML=formatValue(val);
  }catch(e){ S.error=(e&&e.msg)?e.msg:"Syntax ERROR"; }
  render();
}
function doCalc(){
  var names=collectVars(root);
  if(!names.length){ S.error="No variables"; render(); return; }
  S.calcExpr=JSON.parse(JSON.stringify(root));
  S.calcPending={queue:names,idx:0,prompt:names[0]+" ?"};
  clearInput();
  render();
}
function calcConfirm(){
  var cp=S.calcPending;
  try{
    var v=evaluateList(root);
    if(isC(v)) v=v.re;
    S.vars[cp.queue[cp.idx]]=v;
  }catch(e){ S.error=(e&&e.msg)?e.msg:"Syntax ERROR"; S.calcPending=null; render(); return; }
  cp.idx++;
  clearInput();
  if(cp.idx>=cp.queue.length){
    try{
      var val=evaluateList(S.calcExpr);
      S.ans=val; S.hasAns=true; S.resultShown=true; S.resultHTML=formatValue(val);
    }catch(e2){ S.error=(e2&&e2.msg)?e2.msg:"Math ERROR"; }
    S.calcPending=null;
  } else {
    cp.prompt=cp.queue[cp.idx]+" ?";
  }
  render();
}
function doSolve(){
  var names=collectVars(root);
  if(!names.length){ S.error="No variable"; render(); return; }
  var v=names[0];
  S.solveExpr=JSON.parse(JSON.stringify(root));
  S.calcPending={solve:true,varName:v,prompt:"Solve "+v+" Initial:"};
  clearInput();
  render();
}
function solveConfirm(){
  var cp=S.calcPending;
  try{
    var guess=evaluateList(root);
    if(isC(guess)) guess=guess.re;
    var result=numericalSolve(S.solveExpr,cp.varName,guess);
    S.vars[cp.varName]=result;
    S.ans=result; S.hasAns=true; S.resultShown=true; S.resultHTML=fmtReal(result);
  }catch(e){ S.error=(e&&e.msg)?e.msg:"Math ERROR"; }
  S.calcPending=null;
  render();
}
function numericalSolve(arr,varName,guess){
  var f=function(x){ return real(evalWithVar(arr,varName,x)); };
  var x=guess, h=1e-6, iter;
  for(iter=0;iter<200;iter++){
    var fx=f(x);
    if(Math.abs(fx)<1e-12) return x;
    var d=(f(x+h)-f(x-h))/(2*h);
    if(Math.abs(d)<1e-14) break;
    var nx=x-fx/d;
    if(!isFinite(nx)) break;
    if(Math.abs(nx-x)<1e-12){ x=nx; break; }
    x=nx;
  }
  var fx2=f(x);
  if(Math.abs(fx2)>1e-6){
    var a=guess-1,b=guess+1,fa=f(a),fb=f(b);
    for(var i=0;i<300 && fa*fb>0;i++){ a-=1; b+=1; fa=f(a); fb=f(b); }
    if(fa*fb<=0){ for(var j=0;j<200;j++){ var m=(a+b)/2,fm=f(m); if(fa*fm<=0){b=m;fb=fm;} else {a=m;fa=fm;} if(Math.abs(b-a)<1e-13) break; } x=(a+b)/2; }
    else throw err("Math ERROR");
  }
  return x;
}
function collectVars(arr){
  var out=[];
  function walk(a){ a.forEach(function(n){ if(!n||typeof n!=="object") return; if(n.t==="variable"&&out.indexOf(n.name)<0) out.push(n.name); for(var k in n){ if(Array.isArray(n[k])) walk(n[k]); } }); }
  walk(arr); return out;
}

/* ============================ MODE KEY HANDLERS ============================ */

   These edit a table of cells rather than `root`, so they take the raw key id

function matrixConfirm(){
